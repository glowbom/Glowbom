[package]
name = "karaoke"
version = "0.1.0"
description = "A small desktop tool for making karaoke songs"
authors = ["Glowbom"]
edition = "2021"

[lib]
name = "karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
